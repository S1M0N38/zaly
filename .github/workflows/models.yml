name: Models

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: models-catalog-pr
  cancel-in-progress: false

jobs:
  models:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun --workspaces install --frozen-lockfile
      - name: Update catalog and write review report
        run: bun run models --report "$RUNNER_TEMP/models-report.md"
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/models-catalog
          delete-branch: true
          add-paths: packages/ai/assets/models.json
          commit-message: "fix(models): update models.dev catalog"
          title: "fix(models): update models.dev catalog"
          body-path: ${{ runner.temp }}/models-report.md
