name: Models

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: models-catalog-pr
  cancel-in-progress: false

jobs:
  models:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - run: bun --workspaces install --frozen-lockfile
      - run: bun run models
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/models-catalog
          delete-branch: true
          add-paths: packages/ai/assets/models.json
          commit-message: "chore(models): update models.dev catalog"
          title: "chore(models): update models.dev catalog"
          body: |
            Updates the bundled models.dev snapshot. This PR is refreshed every 6 hours.

            Review and squash-merge before a release when useful. Releases use
            this checked-in snapshot; publishing never fetches a new catalog.
